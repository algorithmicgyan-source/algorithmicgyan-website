<style>
body{font-family:system-ui,sans-serif;max-width:700px;margin:0 auto;padding:16px;background:#0f0f23;color:#fff;line-height:1.8}
a{color:#60a5fa}
.post-card{background:#1a1a2e;padding:28px;border-radius:16px;margin-top:12px}
.post-card h1{line-height:1.4;font-size:1.4rem}
.post-card img{width:100%;border-radius:12px;margin:16px 0}

.back{display:inline-block;color:#60a5fa;text-decoration:none;font-weight:600;margin-bottom:8px}

.wa{background:#25D366}.wb{background:#075E54}.fb{background:#1877F2}.tw{background:#000}.tg{background:#229ED9}.cp{background:#555}.dl{background:#7C3AED}.imgshare{background:#00a8cc}.imgdl{background:#555}

<body>
<a href="posts.html" class="back">← सभी पोस्ट</a>
<div id="post"></div>
<script>
var slug = new URLSearchParams(location.search).get("slug");
var AG_POST = null;
function agDownloadPost(b){
  if(!AG_POST) return;
  var div = document.createElement("div");
  div.innerHTML = AG_POST.content || "";
  var body = div.textContent || div.innerText || "";
  var txt = AG_POST.title + "\n" + (AG_POST.date || "") + " | " + (AG_POST.category || "") + "\n\n" + body
    + "\n\n— Algorithmic Gyan\n" + location.href;
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], {type: "text/plain;charset=utf-8"}));
  a.download = slug + ".txt";
  document.body.appendChild(a); a.click(); a.remove();
  if(b){ var old = b.textContent; b.textContent = "✅ Downloaded!"; setTimeout(function(){ b.textContent = old; }, 2000); }
}
fetch("data/posts.json").then(function(r){return r.json();}).then(function(d){
  var p = d.posts.find(function(x){return x.slug === slug;});
  AG_POST = p || null;
  var el = document.getElementById("post");
  if(!p){ el.innerHTML = "<p>पोस्ट नहीं मिली!</p>"; return; }
  document.getElementById("pgTitle").textContent = p.title + " | Algorithmic Gyan";
  var img = '<img src="'+(p.image || "assets/logo.png")+'" alt="" loading="lazy">';
  var pageUrl = location.href;
  el.innerHTML = '<div class="post-card">'
    + '<h1>'+p.title+'</h1>'
    + '<div class="meta"> '+p.date+' | 📂 '+p.category+'</div>'
    + img
    + '<div>'+p.content+'</div>'
    + '<div class="share-row">'
    + '<a class="wa" target="_blank" href="https://wa.me/?text='+encodeURIComponent(p.title+"\n\n👉 पढ़ें: "+pageUrl)+'">📲 WhatsApp</a>'
    + '<a class="wb" target="_blank" href="https://wa.me/?text='+encodeURIComponent(p.title+"\n\n👉 पढ़ें: "+pageUrl)+'">💼 WhatsApp Business</a>'
    + '<button class="dl" onclick="agDownloadPost(this)">⬇️ Download</button>'
    + '<a class="fb" target="_blank" href="https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(pageUrl)+'">👍 Facebook</a>'
    + '<a class="tw" target="_blank" href="https://twitter.com/intent/tweet?text='+encodeURIComponent(p.title)+'&url='+encodeURIComponent(pageUrl)+'">𝕏 X</a>'
    + '<a class="tg" target="_blank" href="https://t.me/share/url?url='+encodeURIComponent(pageUrl)+'&text='+encodeURIComponent(p.title)+'">✈️ Telegram</a>'
    + '<button class="cp" onclick="agCopy(\''+pageUrl+'\',this)">🔗 Copy Link</button>'
    + '<button class="imgshare" onclick="agShareImage(this)">🖼️ Status par image lagao</button>'
    + '<button class="imgdl" onclick="agDownloadImage(this)">⬇️ Image download</button>'
    + '</div></div>';
});
function agCopy(u,b){navigator.clipboard.writeText(u).then(function(){b.textContent="✅ Copied!";setTimeout(function(){b.textContent="🔗 Copy Link";},2000);});}
/* WhatsApp Business: Android par Business app (com.whatsapp.w4b) kholo, na ho to wa.me fallback; non-Android par wa.me. */
document.addEventListener("click", function (ev) {
  if (ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
  var t = ev.target;
  var a = (t && t.closest) ? t.closest("a.wb") : null;
  if (!a || !a.href) return;
  if (/Android/i.test(navigator.userAgent)) {
    ev.preventDefault();
    var text = "";
    try { text = new URL(a.href).searchParams.get("text") || ""; } catch (e) {}
    window.location.href = "intent://send?text=" + encodeURIComponent(text)
      + "#Intent;scheme=whatsapp;package=com.whatsapp.w4b;S.browser_fallback_url="
      + encodeURIComponent(a.href) + ";end";
  }
});
/* Post image share: WhatsApp Status ko image file hi mile, sirf link nahi.
   Native share sheet me image jaati hai; support na ho to image download hoti hai. */
function agPostImgUrl(){ var img = document.querySelector("#post img"); return img ? (img.currentSrc || img.src) : null; }
function agDownloadImage(b){
  var url = agPostImgUrl(); if(!url) return;
  var a = document.createElement("a"); a.href = url; a.download = "algorithmic-gyan-image";
  document.body.appendChild(a); a.click(); a.remove();
  if(b){ var old = b.textContent; b.textContent = "✅ Downloaded!"; setTimeout(function(){ b.textContent = old; }, 2000); }
}
function agShareImage(b){
  var url = agPostImgUrl(); if(!url) return;
  function fallback(){ agDownloadImage(b); }
  fetch(url).then(function(r){ return r.blob(); }).then(function(blob){
    var ext = (blob.type && blob.type.split("/")[1]) || "png";
    var file = new File([blob], "algorithmic-gyan." + ext, {type: blob.type || "image/png"});
    if (navigator.canShare && navigator.canShare({files: [file]})) {
      return navigator.share({files: [file], title: document.title}).catch(function(){ fallback(); });
    }
    fallback();
  }).catch(function(){ fallback(); });
}
</script>
<script>
// URL me #section ho to SIRF wahi section dikhao
setTimeout(function(){
  var hash = window.location.hash;
  if(hash && hash.length > 1){
    var targetId = hash.substring(1);
    var target = document.getElementById(targetId);
    if(target){
      var postEl = document.getElementById("post");
      var allH2 = postEl.querySelectorAll("h2");
      if(allH2.length > 1){
        // Har h2 ke baad wala content us section ka hai
        // Sirf target section dikhao, baaki chhupao
        var capture = false;
        var walker = document.createTreeWalker(postEl, NodeFilter.SHOW_ELEMENT);
        var nodes = [];
        while(walker.nextNode()) nodes.push(walker.currentNode);
        for(var i = 0; i < nodes.length; i++){
          var el = nodes[i];
          if(el.tagName === "H2"){
            capture = (el.id === targetId);
            el.style.display = capture ? "" : "none";
          } else if(el.tagName !== "SCRIPT" && el.tagName !== "STYLE"){
            // Check karo ye kis section me hai
            var parent = el;
            var inTarget = false;
            // Agar ye target h2 ke baad aur agle h2 se pehle hai
            el.style.display = ""; // pehle reset
          }
        }
        // Simple approach: sab h2 ke sections ko div me wrap karke filter karo
        var html = postEl.innerHTML;
        var parts = html.split(/(<h2[^>]*>)/);
        var newHtml = parts[0]; // h1, meta etc.
        var currentId = null;
        for(var j = 1; j < parts.length; j += 2){
          var h2tag = parts[j];
          var content = parts[j+1] || "";
          var idMatch = h2tag.match(/id="([^"]+)"/);
          currentId = idMatch ? idMatch[1] : null;
          if(currentId === targetId){
            newHtml += h2tag + content;
          }
        }
        // Agar kuch mila to replace karo
        if(newHtml !== parts[0]){
          // "Sab dekho" button ke saath
          var backBtn = '<a href="' + window.location.pathname + window.location.search + '" style="display:inline-block;margin:10px 0;padding:8px 16px;background:#1a73e8;color:#fff;border-radius:8px;text-decoration:none;font-weight:600">← Sab sections dekho</a><br><br>';
          postEl.innerHTML = backBtn + newHtml;
        } else {
          target.scrollIntoView({behavior:"smooth", block:"start"});
        }
      } else {
        target.scrollIntoView({behavior:"smooth", block:"start"});
      }
    }
  }
}, 800);
</script>
