name: Auto-update YouTube videos

# Roz subah 6 baje (IST ~11:30) channel ki nayi videos check karo
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest videos from YouTube RSS and merge
        run: |
          python3 << 'EOF'
          import json, urllib.request, xml.etree.ElementTree as ET

          CHANNEL_ID = "UCHQrkzEHfMxs8audbrra5Wg"
          url = f"https://www.youtube.com/feeds/videos.xml?channel_id={CHANNEL_ID}"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          xml_data = urllib.request.urlopen(req, timeout=30).read()

          ns = {"a": "http://www.w3.org/2005/Atom"}
          root = ET.fromstring(xml_data)

          # Load existing videos
          try:
              with open("data/videos.json", encoding="utf-8") as f:
                  existing = json.load(f)
          except FileNotFoundError:
              existing = []
          by_id = {v["id"]: v for v in existing}

          # Merge RSS videos (new or updated)
          for e in root.findall("a:entry", ns):
              vid = e.find("a:id", ns).text.split(":")[-1]
              title = e.find("a:title", ns).text
              pub = e.find("a:published", ns).text[:10]
              by_id[vid] = {"id": vid, "title": title, "date": pub}

          # Sort: newest dated first, undated keep old order at end
          dated = sorted([v for v in by_id.values() if v.get("date")],
                         key=lambda v: v["date"], reverse=True)
          undated = [v for v in by_id.values() if not v.get("date")]
          videos = dated + undated

          with open("data/videos.json", "w", encoding="utf-8") as f:
              json.dump(videos, f, ensure_ascii=False, indent=1)
          print(f"Total {len(videos)} videos")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "Video Bot"
          git config user.email "bot@algorithmicgyan.in"
          git add data/videos.json
          git diff --staged --quiet || git commit -m "Auto-update: latest YouTube videos"
          git push
