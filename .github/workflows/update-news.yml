name: Auto-update Daily News

# Har 3 ghante me taza khabrein (LIVE feel!)
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install article text extractor
        run: pip3 install trafilatura || pip3 install --break-system-packages trafilatura

      - name: Fetch daily news from RSS sources
        run: |
          python3 << 'EOF'
          import json, urllib.request, xml.etree.ElementTree as ET, html, re
          from email.utils import parsedate_to_datetime
          from datetime import datetime, timezone, timedelta

          SOURCES = [
              ("ABP News", "https://www.abplive.com/news/india/feed"),
              ("NDTV Khabar", "https://news.google.com/rss/search?q=site:khabar.ndtv.com&hl=hi&gl=IN&ceid=IN:hi"),
              ("AIR", "https://news.google.com/rss/search?q=%22all+india+radio%22+OR+%22akashvani%22&hl=hi&gl=IN&ceid=IN:hi"),
              ("Hindi News", "https://news.google.com/rss?hl=hi&gl=IN&ceid=IN:hi"),
              ("PIB", "https://news.google.com/rss/search?q=PIB+%22Press+Information+Bureau%22&hl=hi&gl=IN&ceid=IN:hi"),
              ("MP News", "https://news.google.com/rss/search?q=%E0%A4%AE%E0%A4%A7%E0%A5%8D%E0%A4%AF+%E0%A4%AA%E0%A5%8D%E0%A4%B0%E0%A4%A6%E0%A5%87%E0%A4%B6&hl=hi&gl=IN&ceid=IN:hi"),
          ]

          def fmt_date(pub):
              try:
                  dt = parsedate_to_datetime(pub)
                  ist = dt.astimezone(timezone(timedelta(hours=5, minutes=30)))
                  return ist.strftime("%d %b %Y, %I:%M %p")
              except:
                  return pub[:5] if pub else ""

          def clean(s):
              if not s:
                  return ""
              s = html.unescape(s)
              s = re.sub(r"<[^>]+>", "", s)
              return s.strip()

          def is_hindi(s):
              # Sirf Hindi (Devanagari) headlines rakho — pure Hindi feed
              return any("ऀ" <= c <= "ॿ" for c in (s or ""))

          all_news = []
          for name, url in SOURCES:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  data = urllib.request.urlopen(req, timeout=30).read()
                  root = ET.fromstring(data)
                  _limit = 8 if name == "MP News" else 5
                  items = root.find("channel").findall("item")[:_limit]
                  for i in items:
                      title_el = i.find("title")
                      link_el = i.find("link")
                      pub_el = i.find("pubDate")
                      desc_el = i.find("description")
                      title = clean(title_el.text if title_el is not None else "")
                      link = (link_el.text or "").strip() if link_el is not None else ""
                      pub = pub_el.text if pub_el is not None else ""
                      desc = clean(desc_el.text if desc_el is not None else "")[:800]
                      # Image nikalo - kayi tariko se
                      img_url = ""
                      for _el in i.iter():
                          _tag = _el.tag.split("}")[-1] if "}" in _el.tag else _el.tag
                          # media:content ya media:thumbnail
                          if _tag in ("content", "thumbnail") and "url" in _el.attrib:
                              _u = _el.attrib["url"]
                              if (".jpg" in _u or ".png" in _u or ".jpeg" in _u or "ndtvimg" in _u or "abplive" in _u) and "gstatic" not in _u and "googleusercontent" not in _u:
                                  img_url = _u; break
                          # enclosure tag
                          if _tag == "enclosure" and "url" in _el.attrib:
                              _u = _el.attrib["url"]
                              if (".jpg" in _u or ".png" in _u) and "gstatic" not in _u:
                                  img_url = _u; break
                      # Description me <img> tag dhoondho
                      if not img_url and desc_el is not None and desc_el.text:
                          import re as _re2
                          _m = _re2.search(r'<img[^>]+src=["\']([^"\']+\.(?:jpg|png|jpeg)[^"\']*)["\']', desc_el.text)
                          if _m:
                              _u = _m.group(1)
                              if "gstatic" not in _u and "googleusercontent" not in _u:
                                  img_url = _u
                      # Bekar/generic news skip karo
                      _bad_titles = ["prati ghanta", "news on air", "hourly news"]
                      if any(b in title.lower() for b in _bad_titles):
                          continue
                      if not is_hindi(title):
                          continue  # English headline skip — sirf Hindi
                      if title and link:
                          all_news.append({
                              "source": name, "title": title,
                              "link": link, "date": fmt_date(pub), "desc": desc,
                              "image": img_url,
                          })
                  print(f"{name}: {len(items)} OK")
              except Exception as e:
                  print(f"{name}: FAILED - {e}")

          # Purani news SAVE rakho + nayi jodo (duplicate link hatao)
          import os as _os
          _old = []
          if _os.path.exists("data/news.json"):
              try: _old = json.load(open("data/news.json", encoding="utf-8"))
              except: _old = []
          def _norm_title(t):
              t = re.sub(r"\s*[-\u2013\u2014|]\s*[^\u2013\u2014|]{0,40}$", "", t or "")
              return re.sub(r"\W+", "", t.lower())
          _seen = set(n.get("link","") for n in all_news)
          _seen_titles = set(_norm_title(n.get("title","")) for n in all_news)
          for n in _old:
              if n.get("link","") not in _seen and _norm_title(n.get("title","")) not in _seen_titles and is_hindi(n.get("title","")):
                  all_news.append(n); _seen.add(n.get("link","")); _seen_titles.add(_norm_title(n.get("title","")))
          # Date-wise sort: nayi news pehle
          from datetime import datetime as _dt
          def _dkey(n):
              try:
                  return _dt.strptime(n.get("date","")[:11], "%d %b %Y")
              except:
                  return _dt.min
          all_news.sort(key=_dkey, reverse=True)
          # MP news bachao: top 12 me kam se kam 3 MP items pakke rakho
          _mp_items = [n for n in all_news if n.get("source") == "MP News"][:3]
          _mp_links = set(n.get("link","") for n in _mp_items)
          _others = [n for n in all_news if n.get("link","") not in _mp_links]
          all_news = (_mp_items + _others)[:100]  # archive: kul max 100 save; MP wale pehle rakho

          # Full body + share bar: shared lib (scripts/article_lib.py) — workflow aur backfill dono wahi use karte hain
          import sys as _sys
          _sys.path.insert(0, "scripts")
          import article_lib as _al
          for n in all_news:
              if not n.get("body") and "google.com" not in n.get("link", ""):
                  n["body"] = _al.fetch_body(n["link"])
                  print(f"body: {n['source']} {len(n['body'])} chars")
          for n in all_news:
              n["article"] = _al.article_filename(n)
          for n in all_news:
              _fn = n["article"]
              if _os.path.exists(_fn): continue
              open(_fn, "w").write(_al.build_article_html(n, all_news))

          # SAFETY CHECK: sab articles bane?
          _missing = [n["title"][:40] for n in all_news if n.get("article") and not _os.path.exists(n["article"])]
          if _missing:
              print(f"ERROR: {len(_missing)} articles missing: {_missing}")
              raise SystemExit("Article generation failed!")
          print(f"Articles ready: all {len(all_news)} verified")
          with open("data/news.json", "w", encoding="utf-8") as f:
              json.dump(all_news, f, ensure_ascii=False, indent=1)
          # Archive: saari khabrein hamesha save (lightweight, body ke bina) — calendar + search isi se chalenge
          _arch = []
          if _os.path.exists("data/news-archive.json"):
              try: _arch = json.load(open("data/news-archive.json", encoding="utf-8"))
              except: _arch = []
          _seen_a = set(a.get("link", "") for a in _arch)
          _seen_at = set(_norm_title(a.get("title", "")) for a in _arch)
          for n in all_news:
              if n.get("link", "") not in _seen_a and _norm_title(n.get("title", "")) not in _seen_at:
                  _arch.append({k: n.get(k, "") for k in ("source", "title", "link", "date", "desc", "image", "article")})
                  _seen_a.add(n.get("link", "")); _seen_at.add(_norm_title(n.get("title", "")))
          _arch.sort(key=_dkey, reverse=True)
          with open("data/news-archive.json", "w", encoding="utf-8") as f:
              json.dump(_arch, f, ensure_ascii=False, indent=1)
          print(f"Archive total: {len(_arch)} items")
          # Daily Current Affairs post banao (exam ke liye)
          IST = timezone(timedelta(hours=5, minutes=30))
          _today_ca = datetime.now(IST).strftime("%d %b %Y")
          _today_slug = datetime.now(IST).strftime("%Y-%m-%d")
          _today_news = [n for n in all_news if n.get("date","").startswith(_today_ca)]
          if _today_news:
              _pd = json.load(open("data/posts.json", encoding="utf-8"))
              _existing = [p for p in _pd["posts"] if p.get("slug") == f"current-affairs-{_today_slug}"]
              if _existing:
                  # Purana post hatao, naya banayenge (updated news ke saath)
                  _pd["posts"] = [p for p in _pd["posts"] if p.get("slug") != f"current-affairs-{_today_slug}"]
              if True:
                  _items = []
                  for _i, _n in enumerate(_today_news, 1):
                      _text = (_n['title'] + ' ' + _n.get('desc','')).lower()
                      _mp_keys = ['madhya pradesh','madhya+pradesh','mohan yadav','bhopal','indore','gwalior','jabalpur','ujjain','ratlam','rewa','sagar','satna',
                                  'मध्य प्रदेश','मध्यप्रदेश','मोहन यादव','भोपाल','इंदौर','ग्वालियर','जबलपुर','उज्जैन','रतलाम','रीवा','सागर','सतना','एमपी']
                      _is_mp = _n.get('source') == 'MP News' or any(k in _text for k in _mp_keys)
                      _is_intl = any(k in _text for k in ['america','trump','china','japan','israel','pakistan','sri lanka','un '])
                      _cat = 'mp' if _is_mp else ('intl' if _is_intl else 'nat')
                      _n['_cat'] = _cat
                      _items.append((_cat, _n))
                  _mp_html = "<h2 id=\"mp-special\">🏛️ MP Special</h2>"
                  _nat_html = "<h2 id=\"national\">🇮🇳 National</h2>"
                  _intl_html = "<h2 id=\"international\">🌍 International</h2>"
                  for _cat, _n in _items:
                      _img2 = f"<br><img src='{_n.get('image','')}' style='width:100%;border-radius:12px;margin:12px 0' loading='lazy'>" if _n.get('image') else ""
                      _h = f"<h3>{_n['title']}</h3>{_img2}<p><strong>Date:</strong> {_n['date']} | 📰 {_n['source']}</p><p>{_n.get('desc','')}</p><p><strong>📝 परीक्षा टिप:</strong> तथ्य नोट करें!</p><hr>"
                      if _cat == 'mp': _mp_html += _h
                      elif _cat == 'intl': _intl_html += _h
                      else: _nat_html += _h
                  _date_hdr = f"<div style='background:#1a73e8;color:#fff;padding:12px;border-radius:12px;text-align:center;font-weight:700;margin-bottom:16px'>{_today_ca}</div>"
                  _full = _date_hdr + _mp_html + "<hr>" + _nat_html + "<hr>" + _intl_html
                  _post = {"title": f"Current Affairs: {_today_ca} — परीक्षा के लिए महत्वपूर्ण", "slug": f"current-affairs-{_today_slug}", "category": "current-affairs", "date": _today_slug, "excerpt": f"{_today_ca} की {len(_today_news)} महत्वपूर्ण खबरें", "content": _full, "image": ""}
                  _pd["posts"].insert(0, _post)
                  json.dump(_pd, open("data/posts.json","w",encoding="utf-8"), ensure_ascii=False, indent=1)
                  print(f"Current Affairs post: {_today_ca}")

          print(f"Total {len(all_news)} saved news items")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "News Bot"
          git config user.email "bot@algorithmicgyan.in"
          git add data/news.json data/news-archive.json data/posts.json news/article/
          git diff --staged --quiet || git commit -m "Auto-update: daily news"
          git push
