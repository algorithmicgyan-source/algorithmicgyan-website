name: Auto-update Daily News

# Har 3 ghante me taza khabrein (LIVE feel!)
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install article text extractor
        run: pip3 install trafilatura || pip3 install --break-system-packages trafilatura

      - name: Fetch MP news + Current Affairs
        run: python3 scripts/fetch_news.py

      - name: Commit if changed
        run: |
          git config user.name "News Bot"
          git config user.email "bot@algorithmicgyan.in"
          git add data/news.json data/news-archive.json data/posts.json news/article/
          git diff --staged --quiet || git commit -m "Auto-update: daily news"
          git push
